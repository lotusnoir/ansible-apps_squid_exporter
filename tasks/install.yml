---
- name: "Assert supported architecture"
  ansible.builtin.assert:
    that: ansible_facts.architecture == "x86_64"
    fail_msg: "squid-exporter is only published as linux-amd64 upstream (got {{ ansible_facts.architecture }}). Override squid_exporter_url for other architectures."
    success_msg: "Architecture {{ ansible_facts.architecture }} is supported."

- name: "Check installed squid_exporter binary"
  ansible.builtin.stat:
    path: '{{ squid_exporter_install_dir }}/squid-exporter'
  changed_when: false
  register: squid_exporter_binary

- name: "Install tasks"
  when: not squid_exporter_binary.stat.exists or squid_exporter_force_install | bool
  block:
    - name: "Install requirements"
      ansible.builtin.package:
        name: "ca-certificates"
        state: present
      register: __pkg_result
      retries: 12
      delay: 10
      until: __pkg_result is success

    - name: "Download squid_exporter from target..."
      ansible.builtin.get_url:
        url: '{{ squid_exporter_url }}'
        dest: '{{ squid_exporter_install_dir }}/squid-exporter'
        timeout: 120
        mode: '0755'
        checksum: "{{ squid_exporter_checksum | default(omit) }}"
      register: __dl_result
      retries: 5
      delay: 10
      until: __dl_result is success
      when: not squid_exporter_local_dl | bool
      notify: "Restart squid_exporter"

    - name: "Download squid_exporter from localhost..."
      become: false
      ansible.builtin.get_url:
        url: '{{ squid_exporter_url }}'
        dest: "/tmp/squid-exporter-{{ squid_exporter_version }}"
        timeout: 120
        mode: '0755'
        checksum: "{{ squid_exporter_checksum | default(omit) }}"
      register: __dl_result_local
      retries: 5
      delay: 10
      until: __dl_result_local is success
      delegate_to: localhost
      run_once: true
      when: squid_exporter_local_dl | bool

    - name: "Propagate squid_exporter binary"
      ansible.builtin.copy:
        src: "/tmp/squid-exporter-{{ squid_exporter_version }}"
        dest: '{{ squid_exporter_install_dir }}/squid-exporter'
        mode: '0755'
        owner: root
        group: root
      when: squid_exporter_local_dl | bool
      notify: "Restart squid_exporter"

- name: "Clean up stale local download cache (keep only the current version)"
  become: false
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ lookup('fileglob', '/tmp/squid-exporter-*', wantlist=True) | reject('search', squid_exporter_version) | list }}"
  delegate_to: localhost
  run_once: true
  when: squid_exporter_local_dl | bool
  tags:
    - install
    - cleanup

- name: "Create systemd for squid_exporter"
  ansible.builtin.template:
    src: 'squid_exporter.service.j2'
    dest: '/etc/systemd/system/squid_exporter.service'
    mode: '0644'
  notify: "Restart squid_exporter"

- name: "Enable and Start squid_exporter.service"
  ansible.builtin.service:
    name: squid_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: "Wait for squid_exporter to listen on its metrics port"
  ansible.builtin.wait_for:
    port: "{{ squid_exporter_listen_port }}"
    host: "{{ '127.0.0.1' if squid_exporter_listen_address in ['127.0.0.1', '0.0.0.0'] else squid_exporter_listen_address }}"
    timeout: 15
